apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 186107385777.dkr.ecr.us-east-1.amazonaws.com/flag-service:052ec12f0571638774980e11df95a135f8d5033c
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: FLAG_DATABASE_URL
